name: Integração contínua

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  servidor:
    name: Testes do servidor
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testar verificacao da exposicao do banco
        working-directory: .
        run: python -m unittest discover -s infraestrutura/tests -v

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Validar migrações
        run: |
          alembic upgrade head
          alembic check

      - name: Executar testes
        run: pytest -q

      - name: Verificar Compose sem iniciar containers
        working-directory: .
        run: |
          cp .env.example .env
          sed -i 's/^BD_SENHA=.*/BD_SENHA=segredo-exclusivo-da-ci/' .env
          sed -i 's|^DATABASE_URL=.*|DATABASE_URL=postgresql+psycopg://foco:segredo-exclusivo-da-ci@bd:5432/foco_ocorrencias|' .env
          python infraestrutura/scripts/verificar_banco_docker.py

  interface:
    name: Compilar e testar interface
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Habilitar pnpm
        run: corepack enable

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Compilar
        run: pnpm run build

      - name: Validar tipos dos testes
        run: pnpm run test:types

      - name: Preparar Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Testar dashboards isolados
        run: pnpm run test

      - name: Preservar relatorio dos testes
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: testes-interface
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
